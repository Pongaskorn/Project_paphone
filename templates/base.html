{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PAPhone - ศูนย์ซ่อมมือถือ{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen flex flex-col">
  {% include "partials/navbar.html" %}

  <main class="flex-grow pt-20">
    {% if messages %}
      <div class="max-w-6xl mx-auto px-4 pt-6">
        {% for message in messages %}
          <div class="mb-3 rounded-xl border px-4 py-3 text-sm font-medium
            {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-green-50 border-green-200 text-green-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    // เมนูมือถือ
    var btn = document.getElementById("menu-btn");
    if (btn) {
      btn.addEventListener("click", function () {
        document.getElementById("mobile-menu").classList.toggle("hidden");
      });
    }

    // ปุ่มสั่งซื้อสินค้า (ยังไม่มีตะกร้า ให้ติดต่อร้าน)
    document.querySelectorAll("[data-order]").forEach(function (el) {
      el.addEventListener("click", function () {
        alert('สนใจสั่งซื้อ "' + el.dataset.order + '"\nกรุณาติดต่อร้านที่เบอร์ 08X-XXX-XXXX');
      });
    });
  </script>
</body>
</html>
