{% extends "base.html" %}
{% block title %}{{ title }} - PAPhone{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <a href="{% if ticket %}{% url 'tech:detail' ticket.pk %}{% else %}{% url 'tech:dashboard' %}{% endif %}" class="text-sm text-gray-500 hover:text-red-600 inline-flex items-center gap-1 mb-4">
    <i data-lucide="chevron-left" class="w-4 h-4"></i> ย้อนกลับ
  </a>
  <div class="bg-white rounded-2xl shadow-sm p-6 md:p-8 border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">
      <i data-lucide="wrench" class="w-6 h-6 text-red-600"></i> {{ title }}
    </h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<p class="text-red-500 text-xs mt-1">{{ e }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition flex justify-center items-center gap-2 mt-4">
        <i data-lucide="save" class="w-5 h-5"></i> บันทึก
      </button>
    </form>
  </div>
</div>
{% endblock %}
